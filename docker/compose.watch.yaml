# Resident map updater: ONE container for every map listed in ./maps.json (shape: docker/maps.example.json).
# Separate compose project, it does not touch the game stack:
#   cd <dir with this file> && docker compose pull && docker compose up -d
# Needs next to this file: data/ (output of `build-data`), maps.json, state/ (writable: keeps what was seen and queued),
# db_password (the database user's password, readable by the uid below and nobody else).
#
# Unprivileged: read-only root, no capabilities, 1 CPU at the lowest share, only the iGPU render node, world directories
# read-only. Renders only below --max-load, at most --max-megas mega tiles per batch, closest to a player first.
#
# To receive block-change events from the game server (TORO-Core's map-dirty module) as well, add
# "--dirty-port", "9109" and "--dirty-token-file", "/run/secrets/dirty_token" to the command, publish the port on
# the network the game server can reach (a network both stacks share, not the host's public interface), and add
# the token as another secret. Without a token the feed stays off.
services:
  watch:
    image: ghcr.io/toro-server/toro-renderer:latest
    command: ["watch", "--config", "/config/maps.json", "--state-dir", "/state"]
    networks: [database]
    restart: unless-stopped
    user: "1002:1002"             # any uid that may use the render node
    group_add: ["993", "1001"]    # gid of `render` (iGPU), gid that may read the world files
    devices: ["/dev/dri/renderD128"]
    read_only: true
    tmpfs: ["/tmp:size=512m,exec"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    cpu_shares: 32
    # The kernel charges the iGPU's buffers to this cgroup as shmem: about 1.2 GB while drawing, on top of about 400 MB of
    # anonymous memory. A limit below that total gets the container OOM-killed over and over (every 70 s or so at 1536m).
    mem_limit: 3g
    pids_limit: 256
    environment:
      HOME: /tmp
    secrets: [db_password]
    volumes:
      - ./data:/data:ro
      - ./maps.json:/config/maps.json:ro
      - ./state:/state
      - /srv/minecraft/worlds:/worlds:ro      # the directory holding the region folders named in maps.json

networks:
  # An existing Docker network where the database answers as "tidb" (see "db" in maps.json).
  # Named by the game stack's compose file; set DB_NETWORK if yours differs.
  database:
    external: true
    name: ${DB_NETWORK:-minecraft-network}

secrets:
  db_password:
    file: ./db_password
